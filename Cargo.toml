[package]
name = "geodedeck"
version = "1.0.0"
edition = "2021"
description = "All-in-one Geometry Dash Launcher, Version Slot Manager, Performance Optimizer, Geode Mod Manager, and Encrypted Backup Platform"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui-phosphor = { version = "0.7.3", features = ["regular", "fill"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
flate2 = "1.0"
base64 = "0.22"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
semver = "1.0"
ureq = { version = "2.10", features = ["json"] }
sysinfo = "0.31"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
